<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicios Ciclos</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #0f172a, #020617);
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #020617;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px #00f0ff33;
            width: 400px;
            text-align: center;
        }

        h3 {
            margin-bottom: 20px;
            color: #00f0ff;
            text-shadow: 0 0 10px #00f0ff;
        }

        select, input {
            width: 90%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 10px;
            border: none;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        button {
            margin-top: 15px;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            transition: 0.3s;
        }

        #ejecutar {
            background: #00f0ff;
            color: black;
        }

        #testear {
            background: #8b5cf6;
            color: white;
        }

        button:hover {
            transform: scale(1.05);
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        /* 🔥 CUADRO DE TEST */
        #testResultados {
            margin-top: 12px;
            padding: 10px;
            border-radius: 12px;
            background: #020617;
            border: 1px solid #334155;
            box-shadow: 0 0 10px #8b5cf633;
            font-size: 13px;
        }

        .test-ok {
            border-color: #22c55e;
            box-shadow: 0 0 10px #22c55e55;
            color: #22c55e;
        }

        .test-error {
            border-color: #ef4444;
            box-shadow: 0 0 10px #ef444455;
            color: #ef4444;
        }

        #cajas {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h3>🎮 Ejercicios Ciclos</h3>

    <select id="operacion">
        <option value="">Seleccionar</option>
        <option value="eje16">16. Promedio</option>
        <option value="eje17">17. Eliminar duplicados</option>
        <option value="eje18">18. Ordenar</option>
        <option value="eje19">19. Producto</option>
        <option value="eje20">20. Vocales</option>
    </select>

    <button id="ejecutar">Ejecutar</button>
    <button id="testear">Test</button>

    <div class="result" id="resultados">Resultados...</div>

    <!-- 🔥 CUADRO DE TEST -->
    <div id="testResultados">Test...</div>

    <div id="cajas"></div>

</div>

<script type="module" src="src/principal.js"></script>

</body>
</html>
